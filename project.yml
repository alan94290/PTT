name: PTT
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_PREVIEWS: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PTT:
    type: application
    platform: iOS
    sources:
      - path: Sources/PTT
    resources:
      - path: Sources/PTT/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ptt
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: NO
    info:
      path: Sources/PTT/Resources/Info.plist
      properties:
        CFBundleDisplayName: PTT
        ITSAppUsesNonExemptEncryption: NO
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: NO
    entitlements:
      path: Sources/PTT/Resources/PTT.entitlements
      properties:
        keychain-access-groups: []
  PTTTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PTTTests
    dependencies:
      - target: PTT
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PTT:
    build:
      targets:
        PTT: all
        PTTTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - PTTTests
    run:
      config: Debug
